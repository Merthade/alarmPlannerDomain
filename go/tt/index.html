<script>
    (function () {
        var DEST = 'https://apps.apple.com/app/apple-store/id6772136401?pt=2187944&ct=Social_TikTok&mt=8';
        var SOURCE = 'tiktok';
        var done = false;
        function go() {
            if (done) return;
            done = true;
            location.replace(DEST);
        }
        // Redirect as soon as PostHog reports the event sent, and no later than the cap. The
        // callback is not supported by every posthog build; when it never fires, the cap still
        // redirects, so this is never slower than the old fixed wait.
        if (window.posthog && posthog.capture) {
            posthog.capture('social_redirect',
                            { source: SOURCE, ct: 'Social_TikTok', page: location.pathname },
                            { callback: go });
        }
        // Cap. Enough for the async PostHog script to load and flush on a slow connection.
        // Three independent fallbacks cover a failure here: this timer, the 3s meta refresh in
        // <head>, and the manual link above.
        setTimeout(go, 700);
    })();
